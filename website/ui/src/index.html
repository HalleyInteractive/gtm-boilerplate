  <script>
    window.__APP_ENV__ = window.__APP_ENV__ || {
      PLATFORM_NAME: '__APP_PLATFORM_NAME__',
      MEASUREMENT_PATH: '__APP_MEASUREMENT_PATH__'
    };
    // Container entrypoints sed-replace every occurrence of a placeholder, so a value
    // can never be compared against its own literal sentinel here. Match the shape instead.
    window.__APP_ENV__.isPlaceholder = function (value) {
      return !value || /^__APP_[A-Z_]+__$/.test(value);
    };
    (function() {
      var p = window.__APP_ENV__.PLATFORM_NAME;
      if (!window.__APP_ENV__.isPlaceholder(p)) {
        document.title = 'Demo E-commerce Store - ' + p;
      }
    })();
  </script>

  <script>
    try {

    }

  <!--
    Tag source resolution. Decides where gtm.js is fetched from:
      ?tagsrc=google  -> https://www.googletagmanager.com/gtm.js (third-party)
      ?tagsrc=gateway -> ${MEASUREMENT_PATH}/gtm.js (first-party, via the reverse proxy)
    Precedence: ?tagsrc= > sessionStorage > MEASUREMENT_PATH (injected at container
    startup) > googletagmanager.com.
  -->
  <script>
    (function (w) {
      var GOOGLE = 'https://www.googletagmanager.com';
      var STORAGE_KEY = 'gtm_tagsrc';

      // The edge route only exists when a reverse proxy is in front of the app.
      // Under `ng serve` the placeholder is never substituted, so there is no edge.
      var edge = w.__APP_ENV__.MEASUREMENT_PATH;
      if (w.__APP_ENV__.isPlaceholder(edge) || edge.charAt(0) !== '/') {
        edge = '';
      }
      edge = edge.replace(/\/+$/, '');

      function isKnown(value) {
        return value === 'google' || value === 'gateway';
      }

      // Only these two keywords are accepted, never a caller-supplied URL, so the
      // query string cannot be used to point the tag at an attacker-controlled host.
      var requested = null;
      var match = w.location.search.match(/[?&]tagsrc=([^&]*)/);
      if (match) {
        requested = decodeURIComponent(match[1]);
        if (!isKnown(requested)) {
          if (w.console && w.console.warn) {
            w.console.warn('Ignoring unknown ?tagsrc=' + requested + '. Use "google" or "gateway".');
          }
          requested = null;
        }
      }

      var choice = requested;
      try {
        if (requested) {
          w.sessionStorage.setItem(STORAGE_KEY, requested);
        } else {
          choice = w.sessionStorage.getItem(STORAGE_KEY);
        }
      } catch (e) {
        // sessionStorage can throw when cookies are blocked; keep the requested value.
      }

      if (!isKnown(choice)) {
        choice = edge ? 'gateway' : 'google';
      }
      if (choice === 'gateway' && !edge) {
        // No reverse proxy in front of the app, so the edge route would 404.
        choice = 'google';
      }

      // '' when no reverse proxy is in front of the app, which the UI uses to
      // disable the gateway option.
      w.__APP_ENV__.EDGE_PATH = edge;
      w.__APP_ENV__.TAG_SOURCE = choice;
      w.__APP_ENV__.TAG_BASE = choice === 'gateway' ? edge : GOOGLE;
    })(window);
  </script>
