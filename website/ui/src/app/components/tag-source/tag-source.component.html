<div class="tag-source">
  <h2 class="tag-source-title">Tag source</h2>

  <div class="tag-source-options" role="group" aria-label="Tag source">
    <button
      type="button"
      class="tag-source-option"
      [class.active]="active === 'google'"
      [attr.aria-pressed]="active === 'google'"
      (click)="select('google')">
      <span class="tag-source-option-name">googletagmanager.com</span>
      <span class="tag-source-option-hint">Third-party</span>
    </button>

    <button
      type="button"
      class="tag-source-option"
      [class.active]="active === 'gateway'"
      [attr.aria-pressed]="active === 'gateway'"
      [disabled]="!gatewayAvailable"
      [title]="gatewayAvailable ? '' : 'No reverse proxy is configured for this deployment'"
      (click)="select('gateway')">
      <span class="tag-source-option-name">Tag Gateway</span>
      <span class="tag-source-option-hint">
        {{ gatewayAvailable ? 'First-party · ' + edgePath : 'Not configured' }}
      </span>
    </button>
  </div>

  <p class="tag-source-current">
    Loading <code>{{ base }}/gtm.js</code>
  </p>

  @if (overridden) {
    <button type="button" class="tag-source-reset" (click)="reset()">
      Reset to deployment default
    </button>
  }
</div>
