# Cloud Build pipeline for GTM & Google Tag Gateway Static Test Suite on nielsoverwijn.dev
substitutions:
  _REGION: 'europe-west4'
  _AR_REPO_NAME: 'gtm-boilerplate-repo'
  _MEASUREMENT_PATH: '/d4t4'
  _GTG_TAG_ID: 'GTM-KDFCRJM5'

steps:
  # 1. Build NGINX Docker image with static HTML test suite
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO_NAME}/gtm-boilerplate-nginx:${COMMIT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO_NAME}/gtm-boilerplate-nginx:latest'
      - '-f'
      - 'hosting/nginx/Dockerfile'
      - '.'
    id: 'build-nginx-image'

  # 2. Push Container Image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO_NAME}/gtm-boilerplate-nginx'
    waitFor: ['build-nginx-image']
    id: 'push-nginx-image'

  # 3. Deploy gtm-boilerplate to Google Cloud Run (serving nielsoverwijn.dev)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'gtm-boilerplate'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO_NAME}/gtm-boilerplate-nginx:${COMMIT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--port'
      - '8080'
      - '--update-env-vars'
      - 'MEASUREMENT_PATH=${_MEASUREMENT_PATH},GTG_TAG_ID=${_GTG_TAG_ID}'
    waitFor: ['push-nginx-image']
    id: 'deploy-main'

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO_NAME}/gtm-boilerplate-nginx:${COMMIT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO_NAME}/gtm-boilerplate-nginx:latest'

options:
  logging: CLOUD_LOGGING_ONLY
